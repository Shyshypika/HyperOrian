<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Classes</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; display: flex; flex-direction: column; height: 100vh; background: #121218; color: #fff; }
    #topbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; background: #1e1e28; border-bottom: 1px solid #333; align-items: center; }
    input { padding: 8px 10px; border-radius: 6px; border: 1px solid #444; background: #2a2a36; color: #fff; font-size: 14px; }
    #queryInput { flex: 1; min-width: 180px; }
    button { padding: 8px 14px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; background: #6c5ce7; color: #fff; font-size: 14px; }
    button:hover { opacity: 0.9; }
    #homeBtn { background: #3b3b4f; }
    #gameBtn { background: #e17055; }
    #cloakBtn { background: #00b894; }
    iframe { flex: 1; border: none; width: 100%; background: #fff; }
  </style>
</head>
<body>
  <div id="topbar">
    <button id="homeBtn">Home</button>
    <input id="queryInput" type="text" placeholder="Search FrogFind or paste https://..." />
    <button id="goBtn">Search</button>
    <button id="gameBtn">3D Games (Sandboxed)</button>
    <button id="cloakBtn">Cloak Tab</button>
  </div>
  <iframe id="viewer"></iframe>

  <script id="appScript">
    const WORKER_URL = "https://hyperorianvpn1.yangdaniel64.workers.dev";
    const GAME_PROXY = "https://beautiful.thevoiceexchange.com/";
    const SEARCH_HOME = "http://frogfind.com";
    const SEARCH_QUERY = "http://frogfind.com?q=";

    const queryInput = document.getElementById("queryInput");
    const viewer = document.getElementById("viewer");

    function loadUrl(targetUrl) {
      viewer.src = `${WORKER_URL}/?url=${encodeURIComponent(targetUrl)}`;
    }

    function navigate() {
      let q = queryInput.value.trim();
      if (!q) {
        loadUrl(SEARCH_HOME);
        return;
      }
      let targetUrl = q;
      if (!q.startsWith("http://") && !q.startsWith("https://")) {
        targetUrl = SEARCH_QUERY + encodeURIComponent(q);
      }
      loadUrl(targetUrl);
    }

    loadUrl(SEARCH_HOME);

    document.getElementById("homeBtn").addEventListener("click", () => {
      queryInput.value = "";
      loadUrl(SEARCH_HOME);
    });

    document.getElementById("goBtn").addEventListener("click", navigate);
    queryInput.addEventListener("keypress", (e) => { if (e.key === "Enter") navigate(); });

    // Launch beautiful.thevoiceexchange.com inside a sandboxed about:blank iframe
    document.getElementById("gameBtn").addEventListener("click", () => {
      const win = window.open("about:blank", "_blank");
      if (!win) {
        alert("Pop-up blocked! Click the pop-up icon in your address bar and select Always allow.");
        return;
      }

      win.document.open();
      win.document.write(`<!DOCTYPE html>
<html>
<head>
  <title>Classes</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe
    src="${GAME_PROXY}"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-pointer-lock allow-orientation-lock"
    allow="fullscreen; autoplay; gamepad">
  </iframe>
</body>
</html>`);
      win.document.close();
    });

    // Cloak this main page inside about:blank
    document.getElementById("cloakBtn").addEventListener("click", () => {
      const win = window.open("about:blank", "_blank");
      if (!win) {
        alert("Pop-up blocked! Click the pop-up icon in your address bar and select Always allow.");
        return;
      }
      win.document.open();
      win.document.write(
        `<!DOCTYPE html><html><head><title>Classes</title>${document.head.innerHTML}</head><body>${document.body.innerHTML}</body></html>`
      );
      win.document.close();

      const oldScript = win.document.getElementById("appScript");
      if (oldScript) oldScript.remove();
      const newScript = win.document.createElement("script");
      newScript.textContent = document.getElementById("appScript").textContent;
      win.document.body.appendChild(newScript);
    });
  </script>
</body>
</html>
