<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classes</title>
  <link id="tabIcon" rel="icon" href="Icons/Classroom.svg">
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; display: flex; flex-direction: column; height: 100vh; background: #121218; color: #fff; }
    #topbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; background: #1e1e28; border-bottom: 1px solid #333; align-items: center; }
    input, select { padding: 8px 10px; border-radius: 6px; border: 1px solid #444; background: #2a2a36; color: #fff; font-size: 14px; }
    #queryInput { flex: 1; min-width: 180px; }
    button { padding: 8px 14px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; background: #6c5ce7; color: #fff; font-size: 14px; }
    button:hover { opacity: 0.9; }
    #homeBtn { background: #3b3b4f; }
    #youtubeBtn { background: #cc2936; }
    #settingsBtn { background: #0984e3; }
    #gameBtn { background: #e17055; }
    #cloakBtn { background: #00b894; }
    #quickLinks { display: flex; gap: 6px; }
    .quick-link { width: 38px; height: 38px; padding: 5px; background: #343445; }
    .quick-link img { width: 100%; height: 100%; object-fit: contain; }
    iframe { flex: 1; border: none; width: 100%; background: #fff; }
    #settingsPanel { display: none; position: fixed; z-index: 100; top: 64px; right: 12px; width: min(340px, calc(100vw - 24px)); padding: 16px; border: 1px solid #444; border-radius: 10px; background: #252532; box-shadow: 0 12px 32px #0008; }
    #settingsPanel.open { display: block; }
    .setting-row { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 8px; margin-top: 10px; }
    .icon-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .icon-option { height: 46px; padding: 6px; background: #343445; }
    .icon-option img { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <div id="topbar">
    <button id="homeBtn">Home</button>
    <input id="queryInput" type="text" placeholder="Search HyperOrain or paste https://...">
    <button id="goBtn">Search</button>
    <button id="youtubeBtn">YouTube Viewer</button>
    <button id="gameBtn">3D Games (Sandboxed)</button>
    <button id="settingsBtn">Settings</button>
    <button id="cloakBtn">Cloak Tab</button>
    <div id="quickLinks" aria-label="Quick links">
      <button class="quick-link" data-site="https://google.com" title="Google Classroom">
        <img src="Icons/Classroom.svg" alt="Google Classroom">
      </button>
      <button class="quick-link" data-site="https://google.com" title="Google Docs">
        <img src="Icons/docs.svg" alt="Google Docs">
      </button>
      <button class="quick-link" data-site="https://google.com" title="Google Drive">
        <img src="Icons/google-drive.svg" alt="Google Drive">
      </button>
      <button class="quick-link" data-site="https://google.com" title="Gemini">
        <img src="Icons/Gemini.svg" alt="Gemini">
      </button>
      <button class="quick-link" data-site="https://frogfind.com" title="Froggy Find">
        <img src="Icons/FrogFind.png" alt="FrogFind">
      </button>
    </div>
  </div>

  <div id="settingsPanel" role="dialog" aria-label="Settings">
    <h3>Settings</h3>
    <div class="setting-row">
      <label for="tabTitle">Tab title</label>
      <input id="tabTitle" value="Classes">
    </div>
    <div class="setting-row">
      <label>Tab icon</label>
      <div class="icon-options">
        <button class="icon-option" data-icon="Icons/Classroom.svg" title="Google Classroom">
          <img src="Icons/Classroom.svg" alt="">
        </button>
        <button class="icon-option" data-icon="Icons/docs.svg" title="Google Docs">
          <img src="Icons/docs.svg" alt="">
        </button>
        <button class="icon-option" data-icon="Icons/google-drive.svg" title="Google Drive">
          <img src="Icons/google-drive.svg" alt="">
        </button>
        <button class="icon-option" data-icon="Icons/Gemini.svg" title="Gemini">
          <img src="Icons/Gemini.svg" alt="">
        </button>
        <button class="icon-option" data-icon="Icons/HyperOrain.svg" title="HyperOrain">
          <img src="Icons/HyperOrain.svg" alt="">
        </button>
      </div>
    </div>
  </div>

  <iframe id="viewer"></iframe>

  <script id="appScript">
    const WORKER_URL = "https://workers.dev";
    const GAME_PROXY = "https://thevoiceexchange.com";
    const SEARCH_HOME = "https://onrender.com";
    const SEARCH_QUERY = "https://onrender.com/search?q=";
    const queryInput = document.getElementById("queryInput");
    const viewer = document.getElementById("viewer");

    function safeGetStorage(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }

    function safeSetStorage(key, val) {
      try { localStorage.setItem(key, val); } catch (e) {}
    }

    async function loadUrl(targetUrl) {
      if (targetUrl.startsWith("https://onrender.com") || targetUrl === GAME_PROXY) {
        viewer.removeAttribute("srcdoc");
        viewer.src = targetUrl;
        return;
      }

      const proxiedUrl = `${WORKER_URL}/?url=${encodeURIComponent(targetUrl)}`;

      if (window.location.protocol === "file:" || window.location.href === "about:blank") {
        try {
          const res = await fetch(proxiedUrl);
          const html = await res.text();
          viewer.removeAttribute("src");
          viewer.srcdoc = html;
        } catch (err) {
          viewer.removeAttribute("srcdoc");
          viewer.src = proxiedUrl;
        }
      } else {
        viewer.removeAttribute("srcdoc");
        viewer.src = proxiedUrl;
      }
    }

    function navigate() {
      let q = queryInput.value.trim();
      if (!q) { loadUrl(SEARCH_HOME); return; }
      let targetUrl = q;
      if (!q.startsWith("http://") && !q.startsWith("https://")) {
        targetUrl = SEARCH_QUERY + encodeURIComponent(q);
      }
      loadUrl(targetUrl);
    }

    loadUrl(SEARCH_HOME);

    document.getElementById("homeBtn").addEventListener("click", () => { queryInput.value = ""; loadUrl(SEARCH_HOME); });
    document.getElementById("goBtn").addEventListener("click", navigate);
    queryInput.addEventListener("keypress", e => { if (e.key === "Enter") navigate(); });

    document.getElementById("youtubeBtn").addEventListener("click", () => {
      window.location.href = "Youtubeviewer.html";
    });

    document.querySelectorAll(".quick-link").forEach(button => {
      button.addEventListener("click", () => loadUrl(button.dataset.site));
    });

    const settingsPanel = document.getElementById("settingsPanel");
    document.getElementById("settingsBtn").addEventListener("click", () => settingsPanel.classList.toggle("open"));

    document.getElementById("tabTitle").addEventListener("input", event => {
      document.title = event.target.value || "Classes";
      safeSetStorage("hyperorianTabTitle", document.title);
    });

    document.querySelectorAll(".icon-option").forEach(button => {
      button.addEventListener("click", () => {
        const icon = document.getElementById("tabIcon");
        icon.href = button.dataset.icon;
        safeSetStorage("hyperorianTabIcon", button.dataset.icon);
      });
    });

    const savedTitle = safeGetStorage("hyperorianTabTitle");
    const savedIcon = safeGetStorage("hyperorianTabIcon");
    if (savedTitle) { document.title = savedTitle; document.getElementById("tabTitle").value = savedTitle; }
    if (savedIcon) document.getElementById("tabIcon").href = savedIcon;

    document.getElementById("gameBtn").addEventListener("click", () => {
      const win = window.open("about:blank", "_blank");
      if (!win) { alert("Pop-up blocked! Allow pop-ups and try again."); return; }
      win.document.open();
      win.document.write(`<!DOCTYPE html><html><head><title>Classes</title><style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{width:100%;height:100%;border:0}</style></head><body><iframe src="${GAME_PROXY}" allow="autoplay; fullscreen; gamepad"></iframe></body></html>`);
      win.document.close();
    });

    document.getElementById("cloakBtn").addEventListener("click", () => {
      const win = window.open("about:blank", "_blank");
      if (!win) { alert("Pop-up blocked! Allow pop-ups and try again."); return; }
      win.document.open();
      win.document.write(`<!DOCTYPE html><html><head><title>${document.title}</title>${document.head.innerHTML}</head><body>${document.body.innerHTML}</body></html>`);
      win.document.close();
      const oldScript = win.document.getElementById("appScript");
      if (oldScript) oldScript.remove();
      const newScript = win.document.createElement("script");
      newScript.textContent = document.getElementById("appScript").textContent;
      win.document.body.appendChild(newScript);
    });
  </script>
</body>
</html>
