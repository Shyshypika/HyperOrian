<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orion AI</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      height: 100vh;
    }
    .app {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #1e293b;
      border-left: 1px solid #334155;
      border-right: 1px solid #334155;
      position: relative;
    }
    .lock-screen {
      position: absolute;
      inset: 0;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 10;
    }
    .lock-box {
      width: 100%;
      max-width: 360px;
      background: #1e293b;
      padding: 24px;
      border-radius: 14px;
      border: 1px solid #334155;
      text-align: center;
    }
    .lock-box h2 { margin-top: 0; font-size: 18px; }
    .lock-box p { color: #94a3b8; font-size: 14px; }
    .lock-box input { width: 100%; margin: 12px 0; }
    .lock-box button { width: 100%; }
    .lock-error { color: #f87171; font-size: 13px; margin-top: 8px; min-height: 18px; }

    .header {
      padding: 14px 16px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { margin: 0; font-size: 16px; letter-spacing: 0.5px; }
    button {
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.45;
      font-size: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #3b82f6;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #334155;
      border-bottom-left-radius: 4px;
    }
    .msg.error {
      align-self: center;
      background: #7f1d1d;
      color: #fecaca;
      font-size: 13px;
    }
    .input-area {
      padding: 12px 16px;
      background: #0f172a;
      border-top: 1px solid #334155;
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 15px;
    }
    input:focus { outline: none; border-color: #3b82f6; }
  </style>
</head>
<body>
  <div class="app">
    <!-- Password Lock Screen -->
    <div class="lock-screen" id="lockScreen">
      <form class="lock-box" onsubmit="unlockOrion(event)">
        <h2>Unlock Orion AI</h2>
        <p>Enter the access password to start chatting.</p>
        <input type="password" id="passInput" placeholder="Enter password..." required autofocus />
        <button type="submit">Unlock</button>
        <div class="lock-error" id="lockError"></div>
      </form>
    </div>

    <!-- Main Chat Interface -->
    <div class="header">
      <h1>Orion AI</h1>
      <button class="secondary" onclick="clearChat()">New Chat</button>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="msg assistant">Hello! I'm Orion. How can I help answer your questions today?</div>
    </div>

    <form class="input-area" onsubmit="sendMessage(event)">
      <input type="text" id="userInput" placeholder="Ask Orion a question..." autocomplete="off" required />
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>

  <script>
    // Paste the encrypted string from encrypt.html here:
    const ENCRYPTED_KEY = "eyJzYWx0IjoiY1NBK1Z1YjlkUmpRZzQzd0ZvTFk5QT09IiwiaXYiOiIwVjZadTNaVlNKaDlrWWlHIiwiZGF0YSI6Ijk0aUZYaXhVcFdKQzQ5YzlPTTJLcGJESzlGUTRYNFNsaXltdDFaRXI0dzJmQ091c2dGSVoyV0FaS3RkTUNHZXR6ZlF6QXpVZkdOc0ZyeWRlaU8zV2ZBQ3pJTzRUaGlUVCJ9";

    const SYSTEM_PROMPT = "you are Orion A ai tasked to help answer question that are asked";
    const MODEL = "qwen/qwen3-32b";

    let decryptedApiKey = "";
    let conversationHistory = [];

    const lockScreen = document.getElementById("lockScreen");
    const passInput = document.getElementById("passInput");
    const lockError = document.getElementById("lockError");
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    function b64ToBytes(b64) {
      return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    }

    async function decryptKey(password) {
      const payload = JSON.parse(atob(ENCRYPTED_KEY));
      const salt = b64ToBytes(payload.salt);
      const iv = b64ToBytes(payload.iv);
      const data = b64ToBytes(payload.data);

      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
      const cryptoKey = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, cryptoKey, data);
      return new TextDecoder().decode(decrypted);
    }

    async function unlockOrion(e) {
      e.preventDefault();
      lockError.textContent = "";
      try {
        decryptedApiKey = await decryptKey(passInput.value);
        if (!decryptedApiKey.startsWith("gsk_")) throw new Error("Invalid key");
        sessionStorage.setItem("orion_pass", passInput.value);
        lockScreen.style.display = "none";
        userInput.focus();
      } catch {
        lockError.textContent = "Incorrect password. Try again.";
      }
    }

    // Auto-unlock if already entered in this browser tab
    window.addEventListener("DOMContentLoaded", async () => {
      const savedPass = sessionStorage.getItem("orion_pass");
      if (savedPass) {
        try {
          decryptedApiKey = await decryptKey(savedPass);
          lockScreen.style.display = "none";
        } catch {
          sessionStorage.removeItem("orion_pass");
        }
      }
    });

    function appendMessage(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function clearChat() {
      conversationHistory = [];
      chatBox.innerHTML = '<div class="msg assistant">Conversation reset. What would you like to ask Orion?</div>';
    }

    async function sendMessage(e) {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text || !decryptedApiKey) return;

      appendMessage("user", text);
      userInput.value = "";
      userInput.disabled = true;
      sendBtn.disabled = true;

      conversationHistory.push({ role: "user", content: text });
      const typingIndicator = appendMessage("assistant", "Orion is thinking...");

      try {
        const response = await fetch("https://groq.com", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${decryptedApiKey}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: MODEL,
            messages: [
              { role: "system", content: SYSTEM_PROMPT },
              ...conversationHistory
            ],
            temperature: 0.6,
            max_completion_tokens: 2048,
            top_p: 0.95,
            stream: false
          })
        });

        const data = await response.json();
        if (!response.ok || data.error) {
          throw new Error(data.error?.message || "API request failed");
        }

        let reply = data.choices.message.content;
        reply = reply.replace(/<think>[\s\S]*?<\/think>/g, "").trim();

        typingIndicator.textContent = reply;
        conversationHistory.push({ role: "assistant", content: reply });
      } catch (err) {
        typingIndicator.remove();
        appendMessage("error", `Error: ${err.message}`);
        conversationHistory.pop();
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    }
  </script>
</body>
</html>
