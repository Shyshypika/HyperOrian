<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orion AI</title>
  <script defer src="https://js.puter.com/v2/" onload="window.dispatchEvent(new Event('puter-ready'))" onerror="window.dispatchEvent(new Event('puter-error'))"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; height: 100vh; }
    .app { width: 100%; max-width: 720px; display: flex; flex-direction: column; height: 100vh; background: #1e293b; border-left: 1px solid #334155; border-right: 1px solid #334155; }
    .header { padding: 14px 16px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { margin: 0; font-size: 16px; letter-spacing: 0.5px; }
    button { background: #3b82f6; color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #2563eb; }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .chat-box { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; font-size: 15px; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: #3b82f6; border-bottom-right-radius: 4px; }
    .msg.assistant { align-self: flex-start; background: #334155; border-bottom-left-radius: 4px; }
    .msg.error { align-self: center; background: #7f1d1d; color: #fecaca; font-size: 13px; }
    .input-area { padding: 12px 16px; background: #0f172a; border-top: 1px solid #334155; display: flex; gap: 8px; }
    input { flex: 1; background: #1e293b; color: #f8fafc; border: 1px solid #475569; border-radius: 8px; padding: 10px 14px; font-size: 15px; }
    input:focus { outline: none; border-color: #3b82f6; }

    .loading-screen {
      position: fixed; inset: 0; z-index: 1000; overflow: hidden;
      background: #020617; color: #e2e8f0;
      perspective: 700px; isolation: isolate;
    }
    .loading-screen[hidden] { display: none; }
    .server-tunnel {
      position: absolute; inset: -18%;
      transform-style: preserve-3d;
      background:
        radial-gradient(circle at 50% 50%, rgba(96,165,250,.12) 0 3%, transparent 25%),
        linear-gradient(rgba(30,64,175,.22) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30,64,175,.22) 1px, transparent 1px);
      background-size: auto, 56px 56px, 56px 56px;
      animation: tunnelDrift 5s cubic-bezier(.45,.05,.55,.95) infinite;
    }
    .server-tunnel::before {
      content:""; position:absolute; inset:-10%;
      background: repeating-radial-gradient(ellipse at center, transparent 0 70px, rgba(96,165,250,.12) 72px 74px, transparent 76px 120px);
      animation: wirePulse 1.4s ease-in-out infinite;
    }
    .server-row { position:absolute; width:68%; height:44px; left:16%; display:flex; gap:12px; justify-content:center; }
    .server-row:nth-child(1) { top:12%; transform:scale(.42) translateZ(-300px); }
    .server-row:nth-child(2) { top:28%; transform:scale(.58) translateZ(-220px); }
    .server-row:nth-child(3) { top:43%; transform:scale(.76) translateZ(-120px); }
    .server-row:nth-child(4) { top:58%; transform:scale(.76) translateZ(-120px); }
    .server-row:nth-child(5) { top:73%; transform:scale(.58) translateZ(-220px); }
    .server-unit { flex:1; max-width:240px; border:2px solid #1d4ed8; border-radius:6px; background:#0f172ae8; box-shadow:0 0 14px #1d4ed8; display:flex; align-items:center; justify-content:center; font-size:11px; color:#93c5fd; }
    .server-unit::before { content:""; width:7px; height:7px; border-radius:50%; background:#22d3ee; box-shadow:12px 0 #22d3ee,24px 0 #22d3ee; margin-right:30px; }
    .speed-lines { position:absolute; inset:0; background:repeating-conic-gradient(from 0deg at 50% 50%, transparent 0deg 8deg, rgba(147,197,253,.12) 8.5deg 9deg, transparent 9.5deg 16deg); animation: speedSpin 3.5s linear infinite; mask-image:radial-gradient(circle, transparent 0 8%, #000 38%, transparent 78%); }
    .target-server { position:absolute; left:50%; top:50%; width:230px; height:110px; transform:translate(-50%, -50%) scale(.25); opacity:.05; border:3px solid #60a5fa; border-radius:12px; background:#0f172af5; box-shadow:0 0 20px #2563eb, inset 0 0 25px #1e3a8a; display:grid; place-items:center; text-align:center; animation: driveToServer 4.8s cubic-bezier(.2,.7,.15,1) forwards; }
    .target-server strong { display:block; font-size:22px; letter-spacing:2px; color:white; text-shadow:0 0 18px #60a5fa; }
    .target-server span { display:block; margin-top:7px; color:#93c5fd; font-size:10px; letter-spacing:4px; }
    .lightning { position:absolute; left:50%; top:-15%; width:140px; height:72%; transform:translateX(-50%) rotate(5deg); opacity:0; clip-path:polygon(48% 0,58% 17%,50% 28%,73% 43%,55% 51%,68% 100%,42% 57%,50% 48%,26% 36%,46% 28%); background:linear-gradient(90deg,#c7d2fe,#fff 48%,#60a5fa 52%,#fff); filter:drop-shadow(0 0 18px #fff); animation: lightningStrike 4.8s steps(1,end) forwards; }
    .flash { position:absolute; inset:0; background:white; opacity:0; z-index:20; animation:whiteFlash 4.8s ease-out forwards; }
    .loading-status { position:absolute; left:24px; bottom:24px; z-index:30; font-family:monospace; color:#93c5fd; font-size:11px; letter-spacing:1px; text-transform:uppercase; }

    @keyframes tunnelDrift { 0%{transform:scale(.72) translateZ(-200px)} 65%{transform:scale(1.35) translateZ(40px)} 100%{transform:scale(2.2) translateZ(180px)} }
    @keyframes wirePulse { 50% { opacity:.35; } }
    @keyframes speedSpin { to { transform:rotate(360deg) scale(1.25); } }
    @keyframes driveToServer { 0%{transform:translate(-50%,-50%) scale(.25);opacity:.05} 55%{transform:translate(-50%,-50%) scale(.7);opacity:.75} 82%,100%{transform:translate(-50%,-50%) scale(1.15);opacity:1} }
    @keyframes lightningStrike { 0%,74%,78%,82%,100%{opacity:0} 76%,80%{opacity:1} }
    @keyframes whiteFlash { 0%,78%,82%,100%{opacity:0} 79%{opacity:1} 81%{opacity:.18} }
    @media (prefers-reduced-motion: reduce) { .server-tunnel,.speed-lines,.server-row { animation-duration:8s; } }
  </style>
</head>
<body>
  <div class="loading-screen" id="aiLoadingScreen" role="status" aria-live="polite" aria-label="Loading Orion AI, cannot skip">
    <div class="server-tunnel">
      <div class="server-row"><div class="server-unit">NODE</div><div class="server-unit">MODEL</div><div class="server-unit">CACHE</div></div>
      <div class="server-row"><div class="server-unit">TRAIN</div><div class="server-unit">INFER</div><div class="server-unit">TOKEN</div></div>
      <div class="server-row"><div class="server-unit">GPU 01</div><div class="server-unit">NEURAL</div><div class="server-unit">GPU 04</div></div>
      <div class="server-row"><div class="server-unit">VECTOR</div><div class="server-unit">LINK</div><div class="server-unit">DATA</div></div>
      <div class="server-row"><div class="server-unit">ROUTE</div><div class="server-unit">CORE</div><div class="server-unit">SYNC</div></div>
    </div>
    <div class="speed-lines"></div>
    <div class="target-server"><div><strong>ORION AI</strong><span>SERVER FOUND</span></div></div>
    <div class="lightning"></div>
    <div class="flash"></div>
    <div class="loading-status">Traversing AI server tree // locating Orion AI</div>
  </div>

  <div class="app">
    <div class="header"><h1>Orion AI</h1><button class="secondary" onclick="clearChat()">New Chat</button></div>
    <div class="chat-box" id="chatBox"><div class="msg assistant">Hello! I'm Orion. How can I help answer your questions today?</div></div>
    <form class="input-area" onsubmit="sendMessage(event)"><input type="text" id="userInput" placeholder="Ask Orion a question..." autocomplete="off" required /><button type="submit" id="sendBtn">Send</button></form>
  </div>

  <script>
    const SYSTEM_PROMPT = "you are Orion A ai tasked to help answer question that are asked";
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const aiLoadingScreen = document.getElementById("aiLoadingScreen");
    let cutsceneFinished = false;
    let conversationHistory = [{ role: "system", content: SYSTEM_PROMPT }];

    function finishCutscene() {
      if (cutsceneFinished) return;
      cutsceneFinished = true;
      aiLoadingScreen.hidden = true;
      userInput.disabled = false;
      sendBtn.disabled = false;
      userInput.focus();
    }

    // The cutscene is intentionally mandatory. It runs in full without any skip control.
    window.addEventListener("keydown", e => {
      if (!cutsceneFinished && (e.key === "Escape" || e.key === " " || e.key === "Enter")) {
        e.preventEvent?.();
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);

    setTimeout(finishCutscene, 5200);

    window.addEventListener("puter-ready", () => {
      // Keep the app locked until the cutscene ends, then enable it regardless of load timing.
    });

    window.addEventListener("puter-error", () => {});

    userInput.disabled = true;
    sendBtn.disabled = true;

    function appendMessage(role, text) { const div = document.createElement("div"); div.className = `msg ${role}`; div.textContent = text; chatBox.appendChild(div); chatBox.scrollTop = chatBox.scrollHeight; return div; }
    function clearChat() { conversationHistory = [{ role: "system", content: SYSTEM_PROMPT }]; chatBox.innerHTML = '<div class="msg assistant">Conversation reset. What would you like to ask Orion?</div>'; }
    async function sendMessage(e) {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text || !cutsceneFinished || !window.puter?.ai) return;
      appendMessage("user", text); userInput.value = ""; userInput.disabled = true; sendBtn.disabled = true;
      conversationHistory.push({ role: "user", content: text });
      const typingIndicator = appendMessage("assistant", "Orion is thinking...");
      try {
        const response = await puter.ai.chat(conversationHistory);
        const content = response?.message?.content;
        const reply = Array.isArray(content) ? content.map(part => part.text || "").join("") : (content || String(response));
        typingIndicator.textContent = reply.trim();
        conversationHistory.push({ role: "assistant", content: reply.trim() });
      } catch (err) { typingIndicator.remove(); appendMessage("error", `Error: ${err.message || err}`); conversationHistory.pop(); }
      finally { userInput.disabled = false; sendBtn.disabled = false; userInput.focus(); }
    }
  </script>
</body>
</html>
