<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orion AI</title>
  <script defer src="https://js.puter.com/v2/" onload="window.dispatchEvent(new Event('puter-ready'))" onerror="window.dispatchEvent(new Event('puter-error'))"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      height: 100vh;
    }
    .app {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #1e293b;
      border-left: 1px solid #334155;
      border-right: 1px solid #334155;
    }
    .header {
      padding: 14px 16px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { margin: 0; font-size: 16px; letter-spacing: 0.5px; }
    button {
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.45;
      font-size: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #3b82f6;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #334155;
      border-bottom-left-radius: 4px;
    }
    .msg.error {
      align-self: center;
      background: #7f1d1d;
      color: #fecaca;
      font-size: 13px;
    }
    .input-area {
      padding: 12px 16px;
      background: #0f172a;
      border-top: 1px solid #334155;
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 15px;
    }
    input:focus { outline: none; border-color: #3b82f6; }
    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.96);
      text-align: center;
    }
    .loading-screen[hidden] { display: none; }
    .loading-card { max-width: 320px; }
    .loading-spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 18px;
      border: 4px solid #334155;
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-screen h2 { margin: 0 0 8px; font-size: 20px; }
    .loading-screen p { margin: 0; color: #cbd5e1; font-size: 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .loading-spinner { animation-duration: 2s; }
    }
  </style>
</head>
<body>
  <div class="loading-screen" id="aiLoadingScreen" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="loading-spinner" aria-hidden="true"></div>
      <h2 id="aiLoadingTitle">Starting Orion AI</h2>
      <p id="aiLoadingMessage">Connecting to the AI service…</p>
    </div>
  </div>

  <div class="app">
    <div class="header">
      <h1>Orion AI</h1>
      <button class="secondary" onclick="clearChat()">New Chat</button>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="msg assistant">Hello! I'm Orion. How can I help answer your questions today?</div>
    </div>

    <form class="input-area" onsubmit="sendMessage(event)">
      <input type="text" id="userInput" placeholder="Ask Orion a question..." autocomplete="off" required />
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>

  <script>
    const SYSTEM_PROMPT = "you are Orion A ai tasked to help answer question that are asked";
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const aiLoadingScreen = document.getElementById("aiLoadingScreen");
    const aiLoadingTitle = document.getElementById("aiLoadingTitle");
    const aiLoadingMessage = document.getElementById("aiLoadingMessage");

    let conversationHistory = [
      { role: "system", content: SYSTEM_PROMPT }
    ];

    function setAiReady() {
      if (window.puter && window.puter.ai) {
        aiLoadingScreen.hidden = true;
        userInput.disabled = false;
        sendBtn.disabled = false;
        return true;
      }
      return false;
    }

    window.addEventListener("puter-ready", () => {
      if (!setAiReady()) {
        aiLoadingTitle.textContent = "AI service unavailable";
        aiLoadingMessage.textContent = "The AI service loaded, but could not be initialized. Refresh the page to try again.";
      }
    });

    window.addEventListener("puter-error", () => {
      aiLoadingTitle.textContent = "Couldn't connect to Orion AI";
      aiLoadingMessage.textContent = "Check your internet connection, then refresh this page to try again.";
    });

    userInput.disabled = true;
    sendBtn.disabled = true;
    setTimeout(() => {
      if (!aiLoadingScreen.hidden && window.puter && window.puter.ai) setAiReady();
      else if (!aiLoadingScreen.hidden) {
        aiLoadingTitle.textContent = "Still connecting…";
        aiLoadingMessage.textContent = "The AI service is taking longer than usual to start.";
      }
    }, 12000);

    function appendMessage(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function clearChat() {
      conversationHistory = [{ role: "system", content: SYSTEM_PROMPT }];
      chatBox.innerHTML = '<div class="msg assistant">Conversation reset. What would you like to ask Orion?</div>';
    }

    async function sendMessage(e) {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text || !window.puter?.ai) return;

      appendMessage("user", text);
      userInput.value = "";
      userInput.disabled = true;
      sendBtn.disabled = true;

      conversationHistory.push({ role: "user", content: text });
      const typingIndicator = appendMessage("assistant", "Orion is thinking...");

      try {
        const response = await puter.ai.chat(conversationHistory);
        const content = response?.message?.content;
        const reply = Array.isArray(content)
          ? content.map(part => part.text || "").join("")
          : (content || String(response));

        typingIndicator.textContent = reply.trim();
        conversationHistory.push({ role: "assistant", content: reply.trim() });
      } catch (err) {
        typingIndicator.remove();
        appendMessage("error", `Error: ${err.message || err}`);
        conversationHistory.pop();
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    }
  </script>
</body>
</html>
