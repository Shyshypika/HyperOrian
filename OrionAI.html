<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orion AI</title>
  <script defer src="https://js.puter.com/v2/" onload="window.dispatchEvent(new Event('puter-ready'))" onerror="window.dispatchEvent(new Event('puter-error'))"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; height: 100vh; }
    .app { width: 100%; max-width: 720px; display: flex; flex-direction: column; height: 100vh; background: #1e293b; border-left: 1px solid #334155; border-right: 1px solid #334155; }
    .header { padding: 14px 16px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { margin: 0; font-size: 16px; letter-spacing: 0.5px; }
    button { background: #3b82f6; color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #2563eb; }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .chat-box { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; font-size: 15px; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: #3b82f6; border-bottom-right-radius: 4px; }
    .msg.assistant { align-self: flex-start; background: #334155; border-bottom-left-radius: 4px; }
    .msg.error { align-self: center; background: #7f1d1d; color: #fecaca; font-size: 13px; }
    .input-area { padding: 12px 16px; background: #0f172a; border-top: 1px solid #334155; display: flex; gap: 8px; }
    input { flex: 1; background: #1e293b; color: #f8fafc; border: 1px solid #475569; border-radius: 8px; padding: 10px 14px; font-size: 15px; }
    input:focus { outline: none; border-color: #3b82f6; }

    /* A mandatory 22-second network fly-through: root line, branches, splits, then pulses. */
    .loading-screen { position: fixed; inset: 0; z-index: 1000; overflow: hidden; background: #020617; color: #e2e8f0; isolation: isolate; }
    .loading-screen[hidden] { display: none; }
    .network { position: absolute; inset: 0; width: 100%; height: 100%; }
    .network path { fill: none; stroke: #38bdf8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 7px #38bdf8); }
    .root-line { stroke-dasharray: 600; stroke-dashoffset: 600; animation: drawRoot 4.5s ease-out forwards; }
    .branch { stroke: #60a5fa !important; stroke-dasharray: 480; stroke-dashoffset: 480; animation: drawBranch 4.5s ease-out 4s forwards; }
    .split { stroke: #a5f3fc !important; stroke-width: 2.5 !important; stroke-dasharray: 380; stroke-dashoffset: 380; animation: drawSplit 4s ease-out 8.2s forwards; }
    .pulse { stroke: #fff !important; stroke-width: 5 !important; stroke-dasharray: 16 450; stroke-dashoffset: 466; opacity: 0; animation: travelPulse 2.8s linear 13s 2 forwards; }
    .pulse:nth-of-type(2n) { animation-delay: 13.25s; }
    .pulse:nth-of-type(3n) { animation-delay: 13.5s; }
    .node { fill: #0ea5e9; stroke: #cffafe; stroke-width: 2; filter: drop-shadow(0 0 8px #22d3ee); opacity: 0; transform-box: fill-box; transform-origin: center; animation: nodeWake .7s ease-out 16.3s forwards; }
    .node:nth-of-type(2n) { animation-delay: 16.6s; }
    .node:nth-of-type(3n) { animation-delay: 16.9s; }
    .server-label { position: absolute; left: 50%; top: 50%; z-index: 4; transform: translate(-50%,-50%) scale(.3); opacity: 0; padding: 18px 30px; border: 2px solid #7dd3fc; border-radius: 12px; background: #071426eF; box-shadow: 0 0 28px #0ea5e9, inset 0 0 20px #1e40af; text-align: center; animation: arrive 2.5s ease-out 17s forwards; }
    .server-label strong { display: block; color: #fff; font-size: clamp(20px,4vw,32px); letter-spacing: 4px; text-shadow: 0 0 18px #7dd3fc; }
    .server-label span { display: block; margin-top: 6px; color: #bae6fd; font: 11px monospace; letter-spacing: 3px; }
    .lightning { position: absolute; z-index: 5; left: 50%; top: 5%; width: 120px; height: 80%; transform: translateX(-50%); clip-path: polygon(48% 0,60% 19%,50% 32%,74% 44%,55% 52%,68% 100%,42% 59%,50% 49%,26% 38%,46% 29%); background: white; filter: drop-shadow(0 0 18px white); opacity: 0; animation: strike 22s steps(1,end) forwards; }
    .flash { position: absolute; z-index: 8; inset: 0; background: white; opacity: 0; pointer-events: none; animation: flash 22s ease-out forwards; }
    .loading-status { position: absolute; z-index: 10; left: 24px; right: 24px; bottom: 24px; color: #bae6fd; font: 12px monospace; letter-spacing: 1px; text-transform: uppercase; text-align: center; text-shadow: 0 0 10px #0284c7; }
    @keyframes drawRoot { to { stroke-dashoffset: 0; } }
    @keyframes drawBranch { to { stroke-dashoffset: 0; } }
    @keyframes drawSplit { to { stroke-dashoffset: 0; } }
    @keyframes travelPulse { 0% { opacity: 1; stroke-dashoffset: 466; } 90% { opacity: 1; } 100% { opacity: 0; stroke-dashoffset: 0; } }
    @keyframes nodeWake { 0% { opacity: 0; transform: scale(.2); } 70% { opacity: 1; transform: scale(1.7); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes arrive { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.3); } 70% { opacity: 1; transform: translate(-50%,-50%) scale(1.08); } 100% { opacity: 1; transform: translate(-50%,-50%) scale(1); } }
    @keyframes strike { 0%,88%,90%,93%,100% { opacity: 0; } 89%,92% { opacity: 1; } }
    @keyframes flash { 0%,89%,93%,100% { opacity: 0; } 90% { opacity: 1; } 92% { opacity: .2; } }
    @media (max-width: 600px) { .loading-status { font-size: 10px; } .network path { stroke-width: 4; } }
    @media (prefers-reduced-motion: reduce) { /* Keep the timed cutscene intact, but reduce nonessential flicker. */ .pulse { animation-iteration-count: 1; } }
  </style>
</head>
<body>
  <div class="loading-screen" id="aiLoadingScreen" role="status" aria-live="polite" aria-label="Orion AI network connection cutscene">
    <svg class="network" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <!-- Begin as one trunk line rising from the viewer. -->
      <path class="root-line" d="M500 760 L500 350" />
      <!-- Grow into a broad tree of server routes. -->
      <path class="branch" d="M500 530 C430 485 330 455 170 405" />
      <path class="branch" d="M500 530 C570 485 670 455 830 405" />
      <path class="branch" d="M500 440 C420 390 320 340 190 265" />
      <path class="branch" d="M500 440 C580 390 680 340 810 265" />
      <path class="branch" d="M500 350 C440 300 390 235 330 160" />
      <path class="branch" d="M500 350 C560 300 610 235 670 160" />
      <!-- Each route splits again toward all Neuralink endpoints. -->
      <path class="split" d="M170 405 L95 330 M170 405 L235 315 M170 405 L105 495" />
      <path class="split" d="M830 405 L905 330 M830 405 L765 315 M830 405 L895 495" />
      <path class="split" d="M190 265 L110 195 M190 265 L250 170 M190 265 L115 300" />
      <path class="split" d="M810 265 L890 195 M810 265 L750 170 M810 265 L885 300" />
      <path class="split" d="M330 160 L275 90 M330 160 L380 75 M330 160 L300 220" />
      <path class="split" d="M670 160 L725 90 M670 160 L620 75 M670 160 L700 220" />
      <!-- Bright packets race out along every split route. -->
      <path class="pulse" d="M500 530 C430 485 330 455 170 405 L95 330" />
      <path class="pulse" d="M500 530 C570 485 670 455 830 405 L905 330" />
      <path class="pulse" d="M500 440 C420 390 320 340 190 265 L110 195" />
      <path class="pulse" d="M500 440 C580 390 680 340 810 265 L890 195" />
      <path class="pulse" d="M500 350 C440 300 390 235 330 160 L380 75" />
      <path class="pulse" d="M500 350 C560 300 610 235 670 160 L620 75" />
      <circle class="node" cx="95" cy="330" r="9"/><circle class="node" cx="235" cy="315" r="9"/><circle class="node" cx="105" cy="495" r="9"/>
      <circle class="node" cx="905" cy="330" r="9"/><circle class="node" cx="765" cy="315" r="9"/><circle class="node" cx="895" cy="495" r="9"/>
      <circle class="node" cx="110" cy="195" r="9"/><circle class="node" cx="250" cy="170" r="9"/><circle class="node" cx="115" cy="300" r="9"/>
      <circle class="node" cx="890" cy="195" r="9"/><circle class="node" cx="750" cy="170" r="9"/><circle class="node" cx="885" cy="300" r="9"/>
      <circle class="node" cx="275" cy="90" r="9"/><circle class="node" cx="380" cy="75" r="9"/><circle class="node" cx="300" cy="220" r="9"/>
      <circle class="node" cx="725" cy="90" r="9"/><circle class="node" cx="620" cy="75" r="9"/><circle class="node" cx="700" cy="220" r="9"/>
    </svg>
    <div class="server-label"><div><strong>OREGON AI</strong><span>NEURALINK NETWORK FOUND</span></div></div>
    <div class="lightning" aria-hidden="true"></div>
    <div class="flash" aria-hidden="true"></div>
    <div class="loading-status" id="loadingStatus">Establishing primary neural route…</div>
  </div>

  <div class="app">
    <div class="header"><h1>Orion AI</h1><button class="secondary" onclick="clearChat()">New Chat</button></div>
    <div class="chat-box" id="chatBox"><div class="msg assistant">Hello! I'm Orion. How can I help answer your questions today?</div></div>
    <form class="input-area" onsubmit="sendMessage(event)"><input type="text" id="userInput" placeholder="Ask Orion a question..." autocomplete="off" required /><button type="submit" id="sendBtn">Send</button></form>
  </div>

  <script>
    const SYSTEM_PROMPT = "you are Orion A ai tasked to help answer question that are asked";
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const aiLoadingScreen = document.getElementById("aiLoadingScreen");
    const loadingStatus = document.getElementById("loadingStatus");
    let cutsceneFinished = false;
    let conversationHistory = [{ role: "system", content: SYSTEM_PROMPT }];

    userInput.disabled = true;
    sendBtn.disabled = true;

    // Prevent keyboard attempts to dismiss or skip the full 22-second animation.
    window.addEventListener("keydown", event => {
      if (!cutsceneFinished) {
        event.preventDefault();
        event.stopImmediatePropagation();
      }
    }, true);

    const cutsceneStages = [
      [0, "Establishing primary neural route…"],
      [4200, "Branching through the AI server tree…"],
      [8500, "Splitting routes across the network…"],
      [13000, "Sending signals to all Neuralinks…"],
      [17000, "Neuralinks synchronized // Orion AI located"],
      [19000, "Power surge detected…"]
    ];
    cutsceneStages.forEach(([delay, message]) => setTimeout(() => {
      if (!cutsceneFinished) loadingStatus.textContent = message;
    }, delay));

    setTimeout(() => {
      cutsceneFinished = true;
      aiLoadingScreen.hidden = true;
      userInput.disabled = false;
      sendBtn.disabled = false;
      userInput.focus();
    }, 22000);

    function appendMessage(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function clearChat() {
      conversationHistory = [{ role: "system", content: SYSTEM_PROMPT }];
      chatBox.innerHTML = '<div class="msg assistant">Conversation reset. What would you like to ask Orion?</div>';
    }

    async function sendMessage(event) {
      event.preventDefault();
      const text = userInput.value.trim();
      if (!text || !cutsceneFinished || !window.puter?.ai) return;

      appendMessage("user", text);
      userInput.value = "";
      userInput.disabled = true;
      sendBtn.disabled = true;
      conversationHistory.push({ role: "user", content: text });
      const typingIndicator = appendMessage("assistant", "Orion is thinking...");

      try {
        const response = await puter.ai.chat(conversationHistory);
        const content = response?.message?.content;
        const reply = Array.isArray(content)
          ? content.map(part => part.text || "").join("")
          : (content || String(response));
        typingIndicator.textContent = reply.trim();
        conversationHistory.push({ role: "assistant", content: reply.trim() });
      } catch (error) {
        typingIndicator.remove();
        appendMessage("error", `Error: ${error.message || error}`);
        conversationHistory.pop();
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    }
  </script>
</body>
</html>
