<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orion AI</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      height: 100vh;
    }
    .app {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #1e293b;
      border-left: 1px solid #334155;
      border-right: 1px solid #334155;
    }
    .header {
      padding: 14px 16px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { margin: 0; font-size: 16px; letter-spacing: 0.5px; }
    button {
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.45;
      font-size: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #3b82f6;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #334155;
      border-bottom-left-radius: 4px;
    }
    .msg.error {
      align-self: center;
      background: #7f1d1d;
      color: #fecaca;
      font-size: 13px;
    }
    .input-area {
      padding: 12px 16px;
      background: #0f172a;
      border-top: 1px solid #334155;
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 15px;
    }
    input:focus { outline: none; border-color: #3b82f6; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>Orion AI</h1>
      <button class="secondary" onclick="clearChat()">New Chat</button>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="msg assistant">Hello! I'm Orion. How can I help answer your questions today?</div>
    </div>

    <form class="input-area" onsubmit="sendMessage(event)">
      <input type="text" id="userInput" placeholder="Ask Orion a question..." autocomplete="off" required />
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    let conversationHistory = [];

    function appendMessage(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function clearChat() {
      conversationHistory = [];
      chatBox.innerHTML = '<div class="msg assistant">Conversation reset. What would you like to ask Orion?</div>';
    }

    async function sendMessage(e) {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage("user", text);
      userInput.value = "";
      userInput.disabled = true;
      sendBtn.disabled = true;

      conversationHistory.push({ role: "user", content: text });
      const typingIndicator = appendMessage("assistant", "Orion is thinking...");

      try {
        const response = await fetch("/.netlify/functions/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: conversationHistory })
        });

        const data = await response.json();
        if (!response.ok || data.error) {
          throw new Error(data.error?.message || data.error || "Request failed");
        }

        let reply = data.choices[0].message.content;
        reply = reply.replace(/<think>[\s\S]*?<\/think>/g, "").trim();

        typingIndicator.textContent = reply;
        conversationHistory.push({ role: "assistant", content: reply });
      } catch (err) {
        typingIndicator.remove();
        appendMessage("error", `Error: ${err.message}`);
        conversationHistory.pop();
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    }
  </script>
</body>
</html>
